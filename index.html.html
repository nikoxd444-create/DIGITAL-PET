<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria - Gestión de Mascotas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-800">Mascotas 🐾</h1>
            <p class="text-gray-600">Registro clínico de pacientes</p>
        </header>

        <div class="mb-8">
            <input type="text" placeholder="Buscar mascota..." 
                class="w-full md:w-1/3 p-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img class="w-full h-48 object-cover" src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?q=80&w=400" alt="Max">
                <div class="p-4">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-xl font-bold">Max</h2>
                        <span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full">Estable</span>
                    </div>
                    <p class="text-blue-600 text-sm font-semibold mb-3">Bulldog Francés</p>
                    <div class="text-sm text-gray-600 space-y-1 mb-4">
                        <p><strong>Dueño:</strong> Carlos R.</p>
                        <p><strong>Última Vacuna:</strong> 12/03/2026</p>
                    </div>
                    <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
                        Ver Historial
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img class="w-full h-48 object-cover" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=400" alt="Mimi">
                <div class="p-4">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-xl font-bold">Mimi</h2>
                        <span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded-full">En Revisión</span>
                    </div>
                    <p class="text-pink-600 text-sm font-semibold mb-3">Gato Persa</p>
                    <div class="text-sm text-gray-600 space-y-1 mb-4">
                        <p><strong>Dueño:</strong> Ana L.</p>
                        <p><strong>Última Vacuna:</strong> Pendiente</p>
                    </div>
                    <button class="w-full bg-pink-600 text-white py-2 rounded hover:bg-pink-700 transition">
                        Ver Historial
                    </button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
