<body class="bg-background min-h-screen flex items-center justify-center p-sm md:p-md bg-pattern" data-alt="A serene veterinary clinic background with soft-focus imagery of a clean medical environment. The lighting is bright and warm, with a secondary soft mint wash overlay that creates a calming and professional medical atmosphere. The overall style is corporate modern with high-legibility and minimalist tactile edges.">
<main class="w-full max-w-md">
<!-- Brand Identity -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">VetCare Pro</h1>
<p class="font-body-md text-body-md text-secondary">Advanced Veterinary Management Systems</p>
</div>
<!-- Auth Card -->
<div class="auth-card rounded-xl border border-outline-variant p-md md:p-lg shadow-sm">
<!-- Tabs -->
<div class="flex border-b border-outline-variant mb-md">
<button class="flex-1 py-sm font-label-md text-label-md transition-all tab-active" id="loginTab" onclick="switchTab('login')">
                    Login
                </button>
<button class="flex-1 py-sm font-label-md text-label-md transition-all tab-inactive" id="signupTab" onclick="switchTab('signup')">
                    Sign Up
                </button>
</div>
<!-- Login Form -->
<form class="space-y-md" id="loginForm">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-[44px] pr-sm py-sm rounded-lg border border-outline focus:ring-2 focus:ring-primary-container focus:border-primary outline-none transition-all font-body-md" placeholder="dr.smith@vetcarepro.com" type="email"/>
</div>
</div>
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-[44px] pr-sm py-sm rounded-lg border border-outline focus:ring-2 focus:ring-primary-container focus:border-primary outline-none transition-all font-body-md" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-xs cursor-pointer">
<input class="w-4 h-4 rounded border-outline text-primary focus:ring-primary" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant">Remember Me</span>
</label>
<a class="font-body-md text-body-md text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-sm rounded-lg hover:opacity-90 active:scale-95 transition-all shadow-sm" type="submit">
                    Access Portal
                </button>
</form>
<!-- Sign Up Form (Hidden by default) -->
<form class="space-y-md hidden" id="signupForm">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-[44px] pr-sm py-sm rounded-lg border border-outline focus:ring-2 focus:ring-primary-container focus:border-primary outline-none transition-all font-body-md" placeholder="Dr. Jane Doe" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant">Clinic Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-[44px] pr-sm py-sm rounded-lg border border-outline focus:ring-2 focus:ring-primary-container focus:border-primary outline-none transition-all font-body-md" placeholder="jane@clinic.com" type="email"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-sm">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant">Password</label>
<input class="w-full px-sm py-sm rounded-lg border border-outline focus:ring-2 focus:ring-primary-container focus:border-primary outline-none transition-all font-body-md" placeholder="••••••••" type="password"/>
</div>
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant">Specialization</label>
<select class="w-full px-sm py-sm rounded-lg border border-outline focus:ring-2 focus:ring-primary-container focus:border-primary outline-none transition-all font-body-md bg-white">
<option value="feline">Feline Medicine</option>
<option value="canine">Canine Specialists</option>
<option value="exotic">Exotic Animals</option>
<option value="equine">Equine Care</option>
</select>
</div>
</div>
<button class="w-full bg-tertiary text-on-tertiary font-label-md text-label-md py-sm rounded-lg hover:opacity-90 active:scale-95 transition-all shadow-sm" type="submit">
                    Create Clinic Account
                </button>
</form>
<!-- Social Auth Divider -->
<div class="relative my-lg">
<div class="absolute inset-0 flex items-center">
<span class="w-full border-t border-outline-variant"></span>
</div>
<div class="relative flex justify-center">
<span class="bg-surface px-sm font-label-md text-label-md text-outline">Or continue with</span>
</div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-sm">
<button class="flex items-center justify-center gap-xs py-sm border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-98">

<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-xs py-sm border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-98">
<svg class="w-5 h-5 text-[#1877F2]" fill="currentColor" viewbox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path></svg>
<span class="font-label-md text-label-md text-on-surface">Facebook</span>
</button>
</div>

<!-- Footer -->
<footer class="mt-xl text-center">
<p class="font-body-md text-body-md text-outline">© 2024 VetCare Pro Management Systems. All rights reserved.</p>
<div class="mt-sm space-x-md">
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors" href="#">Emergency Support</a>
</div>
</footer>
</main>
<script>
        function switchTab(type) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginTab.classList.add('tab-active');
                loginTab.classList.remove('tab-inactive');
                signupTab.classList.remove('tab-active');
                signupTab.classList.add('tab-inactive');
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                loginTab.classList.remove('tab-active');
                loginTab.classList.add('tab-inactive');
                signupTab.classList.add('tab-active');
                signupTab.classList.remove('tab-inactive');
            }
        }
    </script>
</body></html>
