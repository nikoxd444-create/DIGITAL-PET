<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Perfil - Digital Pet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-orange-50 min-h-screen flex flex-col">

<!-- NAVBAR -->
<div id="menuUsuario" class="bg-orange-300 px-8 py-4 flex justify-between items-center shadow-md"></div>

<!-- CONTENIDO -->
<div class="flex justify-center items-center flex-1 px-4 py-10">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg">

<!-- Avatar -->
<div class="text-center">
    <img id="avatar"
         src="https://i.pravatar.cc/100"
         class="w-24 h-24 rounded-full mx-auto mb-4">

    <h2 id="nombre" class="text-2xl font-bold text-gray-800"></h2>
    <p id="email" class="text-gray-500"></p>
</div>

<!-- Info -->
<div class="mt-6 space-y-3">
    <p><strong>Nombre:</strong> <span id="nombreInfo"></span></p>
    <p><strong>Email:</strong> <span id="emailInfo"></span></p>
</div>

<!-- Botones -->
<div class="mt-6 flex flex-col gap-3">

    <button onclick="editarPerfil()"
    class="bg-orange-400 text-white py-2 rounded-lg hover:bg-orange-500">
    Editar perfil
    </button>

    <button onclick="cerrarSesion()"
    class="bg-red-500 text-white py-2 rounded-lg hover:bg-red-600">
    Cerrar sesión
    </button>

</div>

</div>
</div>

<script>
// Obtener usuario
const usuario = JSON.parse(localStorage.getItem("usuario"));
const menu = document.getElementById("menuUsuario");

// Verificar sesión
if (!usuario) {
    window.location.href = "login.html";
}

// Navbar dinámica
menu.innerHTML = `
<div class="text-xl font-bold text-gray-800 flex items-center gap-2">
🐾 Digital Pet
</div>

<div class="flex items-center gap-6 text-gray-700 font-semibold">
<a href="index.html">Inicio</a>
<a href="productos.html">Productos</a>

<img src="https://i.pravatar.cc/40"
class="w-10 h-10 rounded-full cursor-pointer">
</div>
`;

// Mostrar datos
document.getElementById("nombre").textContent = usuario.nombre;
document.getElementById("email").textContent = usuario.email;
document.getElementById("nombreInfo").textContent = usuario.nombre;
document.getElementById("emailInfo").textContent = usuario.email;

// Funciones
function cerrarSesion() {
    localStorage.removeItem("usuario");
    window.location.href = "index.html";
}

function editarPerfil() {
    alert("Próximamente podrás editar tu perfil 😎");
}
</script>

</body>
</html>
