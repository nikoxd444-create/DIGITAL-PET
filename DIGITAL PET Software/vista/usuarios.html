<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestión de Usuarios</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen">

<div class="max-w-6xl mx-auto p-10">

<a href="administracion.html" class="text-blue-600 hover:underline">
← Volver a administración
</a>

<h1 class="text-3xl font-bold text-gray-800 mt-4 mb-6">
Gestión de Usuarios
</h1>

<div class="bg-white rounded-xl shadow p-6">

<div class="flex justify-between mb-6">

<h2 class="text-xl font-semibold">
Lista de usuarios
</h2>

<button class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
Registrar usuario
</button>

</div>

<table class="w-full text-left">

<thead class="border-b bg-gray-50">
<tr>
<th class="p-3">Nombre</th>
<th class="p-3">Correo</th>
<th class="p-3">Rol</th>
<th class="p-3">Acciones</th>
</tr>
</thead>

<tbody>

<tr class="border-b">
<td class="p-3">Carlos López</td>
<td class="p-3">carlos@email.com</td>
<td class="p-3" id="rol1">Administrador</td>
<td class="p-3">
<button onclick="abrirModal('rol1')" class="text-blue-600 hover:underline">
Editar
</button>
</td>
</tr>

<tr class="border-b">
<td class="p-3">Laura Pérez</td>
<td class="p-3">laura@email.com</td>
<td class="p-3" id="rol2">Veterinario</td>
<td class="p-3">
<button onclick="abrirModal('rol2')" class="text-blue-600 hover:underline">
Editar
</button>
</td>
</tr>

</tbody>

</table>

</div>

</div>


<!-- MODAL -->

<div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center">

<div class="bg-white rounded-xl shadow-lg p-8 w-96">

<h2 class="text-xl font-semibold mb-4">
Editar Rol
</h2>

<label class="block mb-2 text-gray-600">
Seleccionar nuevo rol
</label>

<select id="nuevoRol" class="w-full border rounded-lg p-2 mb-6">

<option>Administrador</option>
<option>Veterinario</option>
<option>Cliente</option>
<option>Proveedor</option>

</select>

<div class="flex justify-end gap-3">

<button onclick="cerrarModal()"
class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">
Cancelar
</button>

<button onclick="guardarRol()"
class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
Guardar
</button>

</div>

</div>

</div>


<script>

let rolEditando = null

function abrirModal(id){

rolEditando = id

document.getElementById("modal").classList.remove("hidden")

}

function cerrarModal(){

document.getElementById("modal").classList.add("hidden")

}

function guardarRol(){

let nuevoRol = document.getElementById("nuevoRol").value

document.getElementById(rolEditando).innerText = nuevoRol

cerrarModal()

}

</script>

</body>
</html>
