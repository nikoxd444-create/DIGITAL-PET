<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Crear Cita - Digital Pet</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
}

.bg-dark {
  background: radial-gradient(circle at top, #1f2937, #020617);
}

.input-focus:focus {
  box-shadow: 0 0 0 2px #3b82f6;
  border-color: #3b82f6;
}

.btn-hover:hover {
  transform: scale(1.05);
  transition: 0.3s;
}
</style>

</head>

<body class="bg-dark text-white min-h-screen">

<!-- NAVBAR -->
<header class="flex justify-between items-center px-10 py-6 border-b border-white/10">

<a href="index.html" class="text-2xl font-bold">
🐾 Digital Pet
</a>

<nav class="flex gap-8 text-sm text-gray-400">

<a href="mascotas.html" class="hover:text-white">Mascotas</a>
<a href="citas.html" class="hover:text-white">Citas</a>
<a href="historial.html" class="hover:text-white">Historial</a>

</nav>

</header>

<!-- CONTENIDO -->
<section class="flex justify-center items-center py-16 px-6">

<div class="bg-gray-900 p-10 rounded-2xl shadow-xl w-full max-w-2xl">

<h1 class="text-4xl font-extrabold mb-8">
Agendar Cita
</h1>

<form onsubmit="guardarCita(event)" class="grid grid-cols-1 md:grid-cols-2 gap-6">

<!-- MASCOTA -->
<div class="md:col-span-2">
<label class="text-sm text-gray-400">Mascota</label>
<select class="w-full mt-2 p-3 rounded-lg bg-gray-800 border border-gray-700 input-focus outline-none">
<option>Firulais</option>
<option>Michi</option>
</select>
</div>

<!-- FECHA -->
<div>
<label class="text-sm text-gray-400">Fecha</label>
<input type="date"
class="w-full mt-2 p-3 rounded-lg bg-gray-800 border border-gray-700 input-focus outline-none">
</div>

<!-- HORA -->
<div>
<label class="text-sm text-gray-400">Hora</label>

<div class="flex gap-2 mt-2">

<select
class="w-2/3 p-3 rounded-lg bg-gray-800 border border-gray-700 input-focus outline-none">
<option>01:00</option>
<option>02:00</option>
<option>03:00</option>
<option>04:00</option>
<option>05:00</option>
<option>06:00</option>
<option>07:00</option>
<option>08:00</option>
<option>09:00</option>
<option>10:00</option>
<option>11:00</option>
<option>12:00</option>
</select>

<select
class="w-1/3 p-3 rounded-lg bg-gray-800 border border-gray-700 input-focus outline-none">
<option>AM</option>
<option>PM</option>
</select>

</div>

</div>

<!-- TIPO -->
<div class="md:col-span-2">
<label class="text-sm text-gray-400">Tipo de servicio</label>
<select class="w-full mt-2 p-3 rounded-lg bg-gray-800 border border-gray-700 input-focus outline-none">
<option>Consulta médica</option>
<option>Baño y estética</option>
<option>Vacunación</option>
<option>Control general</option>
</select>
</div>

<!-- NOTAS -->
<div class="md:col-span-2">
<label class="text-sm text-gray-400">Notas adicionales</label>
<textarea rows="3"
class="w-full mt-2 p-3 rounded-lg bg-gray-800 border border-gray-700 input-focus outline-none"
placeholder="Opcional..."></textarea>
</div>

<!-- BOTONES -->
<div class="md:col-span-2 flex justify-between mt-6">

<a href="citas.html"
class="border border-white px-6 py-3 rounded-lg hover:bg-white hover:text-black transition">
Cancelar
</a>

<button type="submit"
class="bg-white text-black px-8 py-3 rounded-lg font-semibold btn-hover">
Guardar Cita
</button>

</div>

</form>

</div>

</section>

<!-- SCRIPT -->
<script>
function guardarCita(e) {
  e.preventDefault();

  alert("Cita agendada correctamente 📅");

  window.location.href = "citas.html";
}
</script>

</body>
</html>
