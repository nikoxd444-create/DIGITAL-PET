<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-orange-50 min-h-screen flex flex-col">

<!-- NAVBAR -->

<div class="sticky top-0 z-50 backdrop-blur-md bg-orange-300/80 px-8 py-4 flex justify-between items-center shadow-lg">

  <!-- LOGO -->
    <a href="index.html" class="text-2xl font-bold text-gray-800 flex items-center gap-2 hover:opacity-80 transition">
    🐾 Digital Pet
    </a>

  <!-- LINKS -->
  <div class="flex items-center gap-8 text-gray-700 font-semibold">

    <a href="index.html" class="relative group">
      Inicio
      <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-white transition-all group-hover:w-full"></span>
    </a>

    <a href="productos.html" class="relative group">
      Productos
      <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-white transition-all group-hover:w-full"></span>
    </a>

    <a href="#" class="relative group">
      Servicios
      <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-white transition-all group-hover:w-full"></span>
    </a>

    <a href="#" class="relative group">
      Citas
      <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-white transition-all group-hover:w-full"></span>
    </a>

  </div>

  <!-- BOTONES -->
  <div class="flex items-center gap-4">

    <a href="login.html"
      class="bg-white px-4 py-2 rounded-lg hover:bg-orange-100 transition duration-300 shadow-sm">
      Ingresar
    </a>

    <a href="registro.html"
      class="bg-orange-500 text-white px-4 py-2 rounded-lg hover:bg-orange-600 transition duration-300 shadow-md">
      Registrarse
    </a>

  </div>

</div>


<!-- LOGIN -->

<div class="flex-grow flex items-center justify-center">

  <div class="bg-white p-8 rounded-xl shadow-lg w-96">

    <h2 class="text-3xl font-bold mb-6 text-gray-800 text-center">
      Iniciar Sesión
    </h2>

    <form class="flex flex-col gap-4">

      <input
        type="email"
        placeholder="Correo electrónico"
        class="border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-300"
        required
      >

      <input
        type="password"
        placeholder="Contraseña"
        class="border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-300"
        required
      >

      <button
        class="bg-orange-400 text-white py-3 rounded-lg hover:bg-orange-500 transition font-semibold shadow-md">
        Ingresar
      </button>

    </form>

  </div>

</div>

</body>
</html>
