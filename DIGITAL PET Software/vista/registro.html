<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Registro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-orange-50 min-h-screen flex flex-col">

<!-- NAVBAR -->

<div class="sticky top-0 z-50 backdrop-blur-md bg-orange-300/80 px-8 py-4 flex justify-between items-center shadow-lg">

  <!-- LOGO -->
  <a href="/" class="text-2xl font-bold text-gray-800 flex items-center gap-2 hover:opacity-80 transition">
    🐾 Digital Pet
  </a>

  <!-- LINKS -->
  <div class="flex items-center gap-8 text-gray-700 font-semibold">

    <a href="/" class="relative group">
      Inicio
      <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-white transition-all group-hover:w-full"></span>
    </a>

    <a href="#" class="relative group">
      Productos
      <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-white transition-all group-hover:w-full"></span>
    </a>

    <a href="#" class="relative group">
      Servicios
      <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-white transition-all group-hover:w-full"></span>
    </a>

    <a href="#" class="relative group">
      Citas
      <span class="absolute left-0 bottom-0 w-0 h-0.5 bg-white transition-all group-hover:w-full"></span>
    </a>

  </div>

  <!-- BOTONES -->
  <div class="flex items-center gap-4">

    <a href="/login"
      class="bg-white px-4 py-2 rounded-lg hover:bg-orange-100 transition duration-300 shadow-sm">
      Ingresar
    </a>

    <a href="/registro"
      class="bg-orange-500 text-white px-4 py-2 rounded-lg hover:bg-orange-600 transition duration-300 shadow-md">
      Registrarse
    </a>

  </div>

</div>

<!-- REGISTRO -->

<div class="grid md:grid-cols-2 flex-grow">

  <!-- FORMULARIO -->
  <div class="flex items-center justify-center p-6">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">

      <h2 class="text-3xl font-bold mb-6 text-gray-800 text-center">
        Crear Cuenta 🐾
      </h2>

      <form action="/guardar_usuario" method="POST" class="flex flex-col gap-3">

        <!-- NOMBRE -->
        <input
          type="text"
          name="nombre"
          placeholder="Nombre completo"
          class="border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-300"
          required
        >

        <!-- CORREO -->
        <input
          type="email"
          name="correo"
          placeholder="Correo electrónico"
          class="border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-300"
          required
        >

        <!-- TELEFONO -->
        <input
          type="tel"
          name="telefono"
          placeholder="Teléfono"
          class="border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-300"
          required
        >

        <!-- CEDULA -->
        <input
          type="text"
          name="cedula"
          placeholder="Número de documento"
          class="border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-300"
          required
        >

        <!-- DIRECCION -->
        <input
          type="text"
          name="direccion"
          placeholder="Dirección"
          class="border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-300"
          required
        >

        <!-- CONTRASEÑA -->
        <input
          type="password"
          name="password"
          placeholder="Contraseña"
          class="border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-300"
          required
        >

        <!-- CONFIRMAR CONTRASEÑA -->
        <input
          type="password"
          name="confirmar"
          placeholder="Confirmar contraseña"
          class="border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-300"
          required
        >

        <!-- BOTON -->
        <button
          type="submit"
          class="bg-orange-400 text-white py-3 rounded-lg hover:bg-orange-500 transition font-semibold mt-2 shadow-md">
          Registrarse
        </button>

      </form>

    </div>

  </div>

</div>

</body>
</html>
