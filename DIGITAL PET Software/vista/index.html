<!DOCTYPE html>
<html>
<head>
<title>Mi Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
    font-family: Arial;
    background:#f4f4f4;
}

.dashboard{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
}
</style>
</head>

<body>

<h1>Dashboard de Ventas</h1>

<div class="dashboard">

<div class="card">
<h3>Usuarios</h3>
<p>120</p>
</div>

<div class="card">
<h3>Ventas</h3>
<p>$3,500</p>
</div>

<div class="card">
<h3>Pedidos</h3>
<p>45</p>
</div>

<div class="card">
<canvas id="grafica"></canvas>
</div>

</div>

<script>
const ctx = document.getElementById('grafica');

new Chart(ctx, {
type: 'bar',
data: {
labels: ['Ene','Feb','Mar','Abr'],
datasets: [{
label: 'Ventas',
data: [10,20,15,30]
}]
}
});
</script>

</body>
</html>
