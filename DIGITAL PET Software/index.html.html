<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria - Gestión de Mascotas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900">

    <div class="max-w-6xl mx-auto p-6 md:p-12">
        
        <header class="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
            <div>
                <h1 class="text-5xl font-black text-indigo-950 leading-tight">Mascotas 🐾</h1>
                <p class="text-slate-500 text-lg font-medium">Buscador y registro clínico</p>
            </div>

            <div class="relative w-full md:w-80">
                <input type="text" placeholder="Buscar por nombre o dueño..." 
                    class="w-full pl-12 pr-4 py-3 rounded-2xl border-none bg-white shadow-lg shadow-indigo-100 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                <div class="absolute left-4 top-3.5 text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <div class="group bg-white rounded-[2.5rem] shadow-xl shadow-indigo-100 p-5 border border-white hover:border-indigo-200 transition-all duration-300">
                <div class="relative overflow-hidden rounded-3xl h-52 mb-5">
                    <img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?q=80&w=400" alt="Max">
                    <span class="absolute top-4 right-4 bg-green-500 text-white text-[10px] font-black px-3 py-1.5 rounded-full uppercase tracking-widest shadow-lg">Estable</span>
                </div>
                
                <div class="px-2">
                    <h2 class="text-2xl font-bold text-slate-800">Max</h2>
                    <p class="text-indigo-600 font-bold text-sm mb-4">Bulldog Francés</p>
                    
                    <div class="bg-slate-50 rounded-2xl p-4 mb-5 space-y-2">
                        <p class="text-xs text-slate-500"><span class="font-bold">Dueño:</span> Carlos R.</p>
                        <p class="text-xs text-slate-500"><span class="font-bold">Última Vacuna:</span> 12/03/2026</p>
                    </div>

                    <div class="flex gap-2">
                        <button class="flex-1 bg-indigo-600 text-white py-3 rounded-xl text-xs font-black uppercase tracking-wider hover:bg-indigo-700 shadow-md shadow-indigo-200 transition">
                            Historial
                        </button>
                        <button class="px-4 py-3 bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="group bg-white rounded-[2.5rem] shadow-xl shadow-indigo-100 p-5 border border-white hover:border-pink-200 transition-all duration-300">
                <div class="relative overflow-hidden rounded-3xl h-52 mb-5">
                    <img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=400" alt="Mimi">
                    <span class="absolute top-4 right-4 bg-amber-500 text-white text-[10px] font-black px-3 py-1.5 rounded-full uppercase tracking-widest shadow-lg">En Revisión</span>
                </div>
                
                <div class="px-2">
                    <h2 class="text-2xl font-bold text-slate-800">Mimi</h2>
                    <p class="text-pink-600 font-bold text-sm mb-4">Gato Persa</p>
                    
                    <div class="bg-slate-50 rounded-2xl p-4 mb-5 space-y-2">
                        <p class="text-xs text-slate-500"><span class="font-bold">Dueña:</span> Ana L.</p>
                        <p class="text-xs text-slate-500"><span class="font-bold">Última Vacuna:</span> Pendiente</p>
                    </div>

                    <div class="flex gap-2">
                        <button class="flex-1 bg-pink-600 text-white py-3 rounded-xl text-xs font-black uppercase tracking-wider hover:bg-pink-700 shadow-md shadow-pink-100 transition">
                            Historial
                        </button>
                        <button class="px-4 py-3 bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

<script>
    const buscador = document.querySelector('input[type="text"]');
    const tarjetas = document.querySelectorAll('.group');

    buscador.addEventListener('input', (e) => {
        const busqueda = e.target.value.toLowerCase();
        
        tarjetas.forEach(tarjeta => {
            const nombre = tarjeta.querySelector('h2').textContent.toLowerCase();
            if (nombre.includes(busqueda)) {
                tarjeta.style.display = 'block';
            } else {
                tarjeta.style.display = 'none';
            }
        });
    });
</script>
</body>
</html>
